# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: stephangriesel/chipchop-2023
  branch: latest
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/ba08433c-5889-4ed6-a801-f4a8bdb0d17f/pkce
  auth_token_endpoint: /sites/ba08433c-5889-4ed6-a801-f4a8bdb0d17f/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://chipchop.nl

media_folder: public/upload
public_folder: /upload

# Run `npx decap-server` alongside `pnpm dev` to edit locally without auth.
local_backend: true

collections:
  - name: galleries
    label: Gallery Posts
    label_singular: Gallery Post
    folder: src/pages/posts
    create: true
    delete: true
    fields:
      - { name: title, widget: string, label: Post Title }
      - name: starredTag
        widget: boolean
        label: Featured Project
        hint: Enabling this will add photo to top. Minimum 3 projects required.
        default: false
      - { name: thumbnail, widget: image, choose_url: true, default: /upload/logogray.svg }
      - { name: description, widget: string, label: Description, required: true }
      - { name: tag, widget: string, label: Tag, required: true }
      - { name: body, widget: markdown, label: Post Body }
      - name: layout
        widget: select
        default: ../../layouts/GalleryPost.astro
        options:
          - { label: Gallery Post, value: ../../layouts/GalleryPost.astro }
